<script>

window.FORA_TRACKING = { GA_ID: 'G-HRPSFHCQR4', META_PIXEL_ID: '1427029515698975', POSTHOG_KEY: 'phc_DgEsWGyq4pUSBpL29A4LrV3Y9fj6XBd48H7FPtjxS7Tw' };
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('consent', 'default', { ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied', analytics_storage: 'denied' });
window.foraLoadAnalytics = function () {
  if (window.foraAnalyticsLoaded) return;
  window.foraAnalyticsLoaded = true;
  var T = window.FORA_TRACKING;
  if (T.GA_ID) {
    gtag('consent', 'update', { analytics_storage: 'granted' });
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(T.GA_ID);
    document.head.appendChild(s);
    gtag('js', new Date());

  if (T.POSTHOG_KEY) window.foraPosthogConsent(true);
  if (T.META_PIXEL_ID) window.foraLoadMeta();
};

/* PostHog consent. Accepted = cookies, heatmaps and autocapture. Anything else (declined, ignored, undecided) = cookieless page counts only. */
window.foraPosthogConsent = function (granted) {
  window.foraPosthogGranted = !!granted;
  var ph = window.posthog;
  if (!ph || !ph.__loaded) return;
  if (granted) {
    ph.opt_in_capturing();
    ph.set_config({ autocapture: true, capture_heatmaps: true });
  } else {
    ph.set_config({ autocapture: false, capture_heatmaps: false });
    ph.opt_out_capturing();
  }
};
window.foraLoadPosthog = function () {
  if (window.foraPosthogLoaded) return;
  window.foraPosthogLoaded = true;
  var granted = false;
  try { granted = localStorage.getItem('fora.consent') === 'granted'; } catch (e) {}
  window.foraPosthogGranted = granted;
  var s = document.createElement('script');
  s.async = true;
  s.crossOrigin = 'anonymous';
  s.src = 'https://eu-assets.i.posthog.com/static/array.js';
  s.onload = function () {
    if (!window.posthog || !window.posthog.init) return;
    window.posthog.init(window.FORA_TRACKING.POSTHOG_KEY, {
      api_host: 'https://eu.i.posthog.com',
      ui_host: 'https://eu.posthog.com',
      person_profiles: 'identified_only',
      cookieless_mode: 'on_reject',
      opt_out_capturing_by_default: !granted,

      loaded: function () { if (window.foraPosthogGranted) window.foraPosthogConsent(true); }
    });
  };
  document.head.appendChild(s);
};
if (window.FORA_TRACKING.POSTHOG_KEY) window.foraLoadPosthog();
try { if (localStorage.getItem('fora.consent') === 'granted') window.foraLoadAnalytics(); } catch (e) {}
</script>
